---
- name: Check whether self-service owns persistent firewall rules
  ansible.builtin.stat:
    path: /etc/infralab-selfservice/policy.json
  register: __firewalld_selfservice_policy
  when: firewalld_unmanaged_objects_clean | bool

- name: Refuse global cleanup when self-service ownership exists
  ansible.builtin.assert:
    that:
      - not __firewalld_selfservice_policy.stat.exists
    fail_msg: >-
      Global firewall cleanup cannot preserve dynamically registered self-service
      rules. Disable firewalld_unmanaged_objects_clean and remove only explicitly
      reviewed administrative objects; disabling admission does not release ownership.
  when: firewalld_unmanaged_objects_clean | bool

- name: Get firewalld configuration
  ansible.posix.firewalld_info:
    active_zones: true
  register: __firewalld_info

- name: Define variable with zones information
  ansible.builtin.set_fact:
    __firewalld_zones:  "{{ __firewalld_info['firewalld_info']['zones'] }}"

- name: Define list with active zone names
  ansible.builtin.set_fact:
    __firewalld_active_zones: "{{ __firewalld_info['collected_zones'] | list }}"

- name: Define variable with unmanaged_[rich_rules,services,protocols,ports,etc]
  ansible.builtin.set_fact:
    __firewalld_unmanaged_objects: "{{ lookup('ansible.builtin.template','unmanaged_objects.yml.j2') | from_yaml | default({},true) }}"

- name: Define variable if __firewalld_unmanaged_objects has not Null items
  set_fact:
    __firewalld_unmanaged_objects_empty: False
  when: item[1] != None
  loop: "{{ __firewalld_unmanaged_objects| items }}"

- name: Show firewalld unmanaged objects, they can be cleaned by pass variable firewalld_unmanaged_objects_clean=true
  ansible.builtin.debug:
    msg: "WARNING !!! This task show unmanage rich_rules,ports,services,protocols etc. They could be cleaned by special boolean variable 'firewalld_unmanaged_objects_clean': {{ __firewalld_unmanaged_objects }}"
  when: __firewalld_unmanaged_objects_empty is defined

- name: Handle when firewalld_unmanaged_objects_clean is true and __firewalld_unmanaged_objects_empty is defined and has value False
  block:
    - name: Clean unmanaged rich-rules
      ansible.posix.firewalld:
        permanent: true
        state: "disabled"
        zone: "{{ item['zone'] }}"
        offline: true
        rich_rule: "{{ item['rule'] }}"
        immediate: true
      loop: "{{ __firewalld_unmanaged_objects['rich_rules'] | default([],true)}}"

    - name: Clean unmanaged services
      ansible.posix.firewalld:
        permanent: true
        state: "disabled"
        zone: "{{ item['zone'] }}"
        offline: true
        service: "{{ item['service'] }}"
        immediate: true
      loop:  "{{ __firewalld_unmanaged_objects['services'] | default([],true)}}"

    - name: Clean unmanaged ports
      ansible.posix.firewalld:
        permanent: true
        state: "disabled"
        zone: "{{ item['zone'] }}"
        offline: true
        port: "{{ item['port'] }}"
        immediate: true
      loop:  "{{ __firewalld_unmanaged_objects['ports'] | default([],true)}}"

    - name: Clean unmanaged protocols
      ansible.posix.firewalld:
        permanent: true
        state: "disabled"
        zone: "{{ item['zone'] }}"
        offline: true
        protocol: "{{ item['protocol'] }}"
        immediate: true
      loop:  "{{ __firewalld_unmanaged_objects['protocols'] | default([],true)}}"
  when: 
    - firewalld_unmanaged_objects_clean == true
    - __firewalld_unmanaged_objects_empty is defined
