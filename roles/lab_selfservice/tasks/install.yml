---
# follow: false refuses a symbolic link or a file in place of a directory. The release directory
# is a separate task: a loop continues after a failed item, which would follow a linked parent.
- name: Create the state, configuration and disk pool directories
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: directory
    follow: false
    owner: root
    group: root
    mode: '{{ item.mode }}'
  loop:
    - {path: /var/lib/infralab-selfservice, mode: '0700'}
    - {path: /etc/infralab-selfservice, mode: '0755'}
    - {path: /var/lib/libvirt/images/selfservice, mode: '0711'}

- name: Create the private release staging area
  ansible.builtin.file:
    path: /var/lib/infralab-selfservice/releases
    state: directory
    follow: false
    owner: root
    group: root
    mode: '0700'

# A damaged record stops the run before anything is copied.
- name: Inspect the record of installed releases
  ansible.builtin.stat:
    path: /var/lib/infralab-selfservice/releases/installed
    follow: false
  register: _lab_release_record_stat

- name: Read the record of installed releases
  ansible.builtin.slurp:
    src: /var/lib/infralab-selfservice/releases/installed
  register: _lab_release_record
  when: _lab_release_record_stat.stat.isreg | default(false)

- name: Require a record of at most two distinct release digests
  ansible.builtin.assert:
    that:
      - not _lab_release_record_stat.stat.exists or _lab_release_record_stat.stat.isreg
      - _lab_recorded_releases | length <= 2
      - _lab_recorded_releases | unique | length == _lab_recorded_releases | length
      - _lab_recorded_releases | reject('match', '^[0-9a-f]{64}\Z') | list | length == 0
    fail_msg: >-
      /var/lib/infralab-selfservice/releases/installed must be a regular file holding the
      installed and the previously installed release SHA256, one per line
  vars:
    _lab_recorded_releases: "{{ (_lab_release_record.content | default('') | b64decode).split() }}"

- name: Keep this release and the one installed before it
  ansible.builtin.set_fact:
    _lab_kept_releases: >-
      {{ [lab_selfservice_release_sha256] +
         (_lab_recorded_releases[1:2] if _lab_recorded_releases[:1] == [lab_selfservice_release_sha256]
          else _lab_recorded_releases[:1]) }}
  vars:
    _lab_recorded_releases: "{{ (_lab_release_record.content | default('') | b64decode).split() }}"

- name: Install the public archive verifier
  ansible.builtin.copy:
    src: verify-release.py
    dest: /var/lib/infralab-selfservice/verify-release.py
    owner: root
    group: root
    mode: '0600'

- name: Copy the reviewed release into private staging
  ansible.builtin.copy:
    src: '{{ lab_selfservice_release_archive }}'
    dest: '/var/lib/infralab-selfservice/releases/{{ lab_selfservice_release_sha256 }}.tar.gz'
    owner: root
    group: root
    mode: '0600'

- name: Verify the archive digest, format and members before extraction
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - /var/lib/infralab-selfservice/verify-release.py
      - '/var/lib/infralab-selfservice/releases/{{ lab_selfservice_release_sha256 }}.tar.gz'
      - '{{ lab_selfservice_release_sha256 }}'
  changed_when: false
  when: not ansible_check_mode

# Staging is rebuilt from the verified archive on every run, so a partial extraction is never
# reused. Whether the host changed is reported by the bundled installer alone.
- name: Discard any earlier extraction of this release
  ansible.builtin.file:
    path: '/var/lib/infralab-selfservice/releases/{{ lab_selfservice_release_sha256 }}'
    state: absent
  changed_when: false
  when: not ansible_check_mode

- name: Create a fresh staging directory for this release
  ansible.builtin.file:
    path: '/var/lib/infralab-selfservice/releases/{{ lab_selfservice_release_sha256 }}'
    state: directory
    owner: root
    group: root
    mode: '0700'
  changed_when: false
  when: not ansible_check_mode

- name: Extract the verified release into staging
  ansible.builtin.unarchive:
    src: '/var/lib/infralab-selfservice/releases/{{ lab_selfservice_release_sha256 }}.tar.gz'
    dest: '/var/lib/infralab-selfservice/releases/{{ lab_selfservice_release_sha256 }}'
    remote_src: true
    owner: root
    group: root
    mode: 'u=rwX,go='
  changed_when: false
  when: not ansible_check_mode

# The result lists every removed path, thousands on the first upgrade from contract 1; it is
# deliberately not printed.
- name: Install the release with its bundled installer
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -IB
      - '/var/lib/infralab-selfservice/releases/{{ lab_selfservice_release_sha256 }}/installer/install.py'
      - apply
      - --staging
      - '/var/lib/infralab-selfservice/releases/{{ lab_selfservice_release_sha256 }}'
  register: _lab_installer
  changed_when: _lab_installer.rc == 0 and (_lab_installer.stdout | from_json).changed
  failed_when: _lab_installer.rc != 0
  when: not ansible_check_mode

- name: Record the installed and the previously installed release
  ansible.builtin.copy:
    content: "{{ _lab_kept_releases | join('\n') }}\n"
    dest: /var/lib/infralab-selfservice/releases/installed
    owner: root
    group: root
    mode: '0600'
  when: not ansible_check_mode

- name: List the release staging area
  ansible.builtin.find:
    paths: /var/lib/infralab-selfservice/releases
    file_type: any
    hidden: true
  register: _lab_release_entries
  when: not ansible_check_mode

# Links are removed, never followed; nothing outside the release staging area is touched.
- name: Remove releases other than the installed and the previously installed one
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: absent
  loop: "{{ _lab_release_entries.files | rejectattr('path', 'in', _lab_kept_paths) | list }}"
  loop_control:
    label: '{{ item.path | basename }}'
  vars:
    _lab_kept_paths: >-
      {{ (_lab_kept_releases + (_lab_kept_releases | map('regex_replace', '$', '.tar.gz') | list) +
          ['installed']) | map('regex_replace', '^', '/var/lib/infralab-selfservice/releases/') | list }}
  when: not ansible_check_mode

# Libvirt owns dynamic sVirt labels below the pool, including running guest disks.
- name: Restore only the managed pool directory label
  ansible.builtin.command:
    argv: [/usr/sbin/restorecon, -F, /var/lib/libvirt/images/selfservice]
  changed_when: false
  when: not ansible_check_mode
