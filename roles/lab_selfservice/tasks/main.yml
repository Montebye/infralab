---
# `-e name=false` passes the string "false", which is truthy in an expression and in a bare `when`
# (ansible-core 2.15). No coercion, so a flag means the same everywhere; the vars lookup resolves
# templated values.
- name: Require real booleans for every flag
  ansible.builtin.assert:
    that: lookup('ansible.builtin.vars', item) is boolean
    fail_msg: >-
      {{ item }} is {{ lookup('ansible.builtin.vars', item) | type_debug }}, not a boolean. Pass
      booleans as JSON, e.g. -e '{"lab_selfservice_enabled": false}', or in a vars file; -e
      name=false passes a string.
  loop:
    - lab_selfservice_enabled
    - lab_selfservice_install
    - lab_selfservice_disk_budget_confirmed
    - lab_selfservice_management_protection_confirmed
    - lab_selfservice_access_audit_confirmed
    - lab_selfservice_manage_enforcement
    - lab_selfservice_manage_network_guard

- name: Require the supported platform and explicit activation evidence
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Rocky'
      - ansible_distribution_major_version == '9'
      - ansible_selinux.status == 'enabled'
      - ansible_selinux.mode == 'enforcing'
      - not lab_selfservice_enabled or lab_selfservice_install
      - not lab_selfservice_enabled or lab_selfservice_disk_budget_confirmed
      - not lab_selfservice_enabled or lab_selfservice_management_protection_confirmed
      - not lab_selfservice_enabled or lab_selfservice_access_audit_confirmed
    fail_msg: 'Rocky 9 with enforcing SELinux and verified disk, management and access evidence required'

# Invalid administrator input is refused before any change, admission included. The include's
# condition is evaluated before anything inside is templated, so a disable run never renders
# the loops over unvalidated policy users and settings.
- name: Require valid release, policy and settings input
  ansible.builtin.include_tasks: inputs.yml
  when: lab_selfservice_install

# The release is identified by its SHA256; where the controller keeps the archive is not intent.
# The vars lookup resolves templated values: the digest follows what is deployed, not how the
# inventory spells it.
- name: Calculate deployment intent including enforcement variables
  ansible.builtin.set_fact:
    _lab_deployment_digest: >-
      {{ dict(_lab_intent_names | zip(query('ansible.builtin.vars', *_lab_intent_names))) |
         to_json(sort_keys=True) | hash('sha256') }}
  vars:
    _lab_intent_names: >-
      {{ query('ansible.builtin.varnames', '^lab_selfservice_') |
         reject('equalto', 'lab_selfservice_release_archive') | sort }}

- name: Inspect successful deployment receipt
  ansible.builtin.stat:
    path: /etc/infralab-selfservice/deployment-receipt
  register: _lab_receipt_stat

- name: Read previous successful deployment receipt
  ansible.builtin.slurp:
    src: /etc/infralab-selfservice/deployment-receipt
  register: _lab_receipt
  when: _lab_receipt_stat.stat.exists

- name: Determine whether deployment intent changed
  ansible.builtin.set_fact:
    _lab_deployment_changed: >-
      {{ not _lab_receipt_stat.stat.exists or
         (_lab_receipt.content | default('') | b64decode | trim) != _lab_deployment_digest }}

- name: Inspect existing administrator entrypoint
  ansible.builtin.stat:
    path: /usr/local/sbin/lab-selfservice-admin
  register: _lab_admin_stat

# The bundled installer swaps drifted trees; that happens only behind a closed gate (spec 11).
# Any non-zero exit counts as unverified, including a usage error of an older administrator
# command without verify-install.
- name: Verify the unchanged installation before retaining open admission
  ansible.builtin.command:
    argv: [/usr/local/sbin/lab-selfservice-admin, verify-install]
  register: _lab_unchanged_install
  changed_when: false
  failed_when: false
  when: >-
    not _lab_deployment_changed and lab_selfservice_enabled and _lab_admin_stat.stat.exists and
    not ansible_check_mode

- name: Decide whether admission closes
  ansible.builtin.set_fact:
    _lab_close_admission: >-
      {{ _lab_deployment_changed or not lab_selfservice_enabled or not _lab_admin_stat.stat.exists or
         (_lab_unchanged_install.rc | default(0)) != 0 }}

- name: Remove admission marker before updates or disablement
  ansible.builtin.file:
    path: /etc/infralab-selfservice/enabled
    state: absent
  when: _lab_close_admission | bool

- name: Close the self-service action before updates or disablement
  ansible.builtin.template:
    src: access.rules.j2
    dest: /etc/polkit-1/rules.d/50-infralab-selfservice.rules
    owner: root
    group: root
    mode: '0644'
  vars:
    lab_selfservice_gate_enabled: false
  when: _lab_close_admission | bool

- name: Drain existing operations and check registry before runtime changes
  ansible.builtin.command:
    argv: [/usr/local/sbin/lab-selfservice-admin, check]
  changed_when: false
  when: _lab_admin_stat.stat.exists and not ansible_check_mode

- name: Audit unchanged runtime before retaining open admission
  ansible.builtin.command:
    argv: [/usr/local/sbin/lab-selfservice-admin, audit, --deployment]
  changed_when: false
  when: not _lab_close_admission | bool and not ansible_check_mode

- name: Validate prepared host prerequisites
  ansible.builtin.include_tasks: preflight.yml
  when: lab_selfservice_install

- name: Install trusted deployment
  ansible.builtin.include_tasks: install.yml
  when: lab_selfservice_install

# Every lab-selfservice-admin command reads the settings, enforcement's account check included.
- name: Install administrator settings before the next administrator command
  ansible.builtin.template:
    src: settings.json.j2
    dest: /etc/infralab-selfservice/settings.json
    owner: root
    group: root
    mode: '0600'
  when: lab_selfservice_install

- name: Install validated administrative policy
  ansible.builtin.include_tasks: policy.yml
  when: lab_selfservice_install

- name: Apply and check participant enforcement
  ansible.builtin.include_tasks: enforcement.yml
  when: lab_selfservice_install

- name: Check registry compatibility without migration
  ansible.builtin.command:
    argv: [/usr/local/sbin/lab-selfservice-admin, check]
  changed_when: false
  when: lab_selfservice_install and not ansible_check_mode

# The runtime audit accepts unlisted files left in the trees; only the manifest comparison does not.
- name: Require the installed release to equal its manifest
  ansible.builtin.command:
    argv: [/usr/local/sbin/lab-selfservice-admin, verify-install]
  changed_when: false
  when: lab_selfservice_install and not ansible_check_mode

- name: Audit runtime and participant access before activation
  ansible.builtin.command:
    argv: [/usr/local/sbin/lab-selfservice-admin, audit, --deployment]
  changed_when: false
  when: lab_selfservice_enabled and not ansible_check_mode

- name: Install or verify guest management protection
  ansible.builtin.include_tasks: network.yml
  when: lab_selfservice_manage_network_guard or lab_selfservice_enabled

- name: Record the fully checked deployment intent
  ansible.builtin.copy:
    content: "{{ _lab_deployment_digest }}\n"
    dest: /etc/infralab-selfservice/deployment-receipt
    owner: root
    group: root
    mode: '0600'
  when: lab_selfservice_install and not ansible_check_mode

- name: Open admission only after successful checks
  ansible.builtin.copy:
    content: "enabled\n"
    dest: /etc/infralab-selfservice/enabled
    owner: root
    group: root
    mode: '0644'
  when: lab_selfservice_enabled and not ansible_check_mode

- name: Enable the self-service action only after successful checks
  ansible.builtin.template:
    src: access.rules.j2
    dest: /etc/polkit-1/rules.d/50-infralab-selfservice.rules
    owner: root
    group: root
    mode: '0644'
  vars:
    lab_selfservice_gate_enabled: true
  when: lab_selfservice_enabled and not ansible_check_mode
