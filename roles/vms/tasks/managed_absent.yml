---
- name: Verify the managed domain identity
  ansible.builtin.command:
    argv: [/usr/bin/virsh, -c, '{{ vms_libvirt_uri }}', domuuid, '{{ vms[0].name }}']
  register: __managed_uuid
  changed_when: false

- name: Reject a changed UUID
  ansible.builtin.assert:
    that: __managed_uuid.stdout | trim == vms[0].uuid

- name: Read managed domain state
  ansible.builtin.command:
    argv: [/usr/bin/virsh, -c, '{{ vms_libvirt_uri }}', domstate, '{{ vms[0].uuid }}']
  register: __managed_state
  changed_when: false

- name: Require a supported deletion state
  ansible.builtin.assert:
    that: __managed_state.stdout | trim in ['running', 'shut off']

- name: Stop the running domain before explicit deletion
  ansible.builtin.command:
    argv: [/usr/bin/virsh, -c, '{{ vms_libvirt_uri }}', destroy, '{{ vms[0].uuid }}']
  when: __managed_state.stdout | trim == 'running'
  changed_when: true

- name: Undefine only the registered domain
  ansible.builtin.command:
    argv: [/usr/bin/virsh, -c, '{{ vms_libvirt_uri }}', undefine, '{{ vms[0].uuid }}']
  changed_when: true
