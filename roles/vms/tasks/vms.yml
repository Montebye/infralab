---
- name: Inspect power state before administrative deletion
  ansible.builtin.command:
    argv: [/usr/bin/virsh, -c, '{{ vms_libvirt_uri }}', domstate, --domain, '{{ item.name }}']
  register: __vms_delete_states
  changed_when: false
  when:
    - item.state | default('') == 'absent'
    - item.name in __vms_on_node
  loop: '{{ vms }}'
  loop_control:
    label: '{{ item.name }}'

- name: Require a supported administrative deletion state
  ansible.builtin.assert:
    that: item.stdout | trim in ['running', 'shut off']
    fail_msg: 'Cannot delete {{ item.item.name }} with power state {{ item.stdout | trim }}'
  when: not (item.skipped | default(false))
  loop: '{{ __vms_delete_states.results }}'
  loop_control:
    label: '{{ item.item.name }}'

- name: Stop running administrative domains before deletion
  ansible.builtin.command:
    argv: [/usr/bin/virsh, -c, '{{ vms_libvirt_uri }}', destroy, --domain, '{{ item.item.name }}']
  changed_when: true
  when:
    - not (item.skipped | default(false))
    - item.stdout | trim == 'running'
  loop: '{{ __vms_delete_states.results }}'
  loop_control:
    label: '{{ item.item.name }}'

- name: Delete administrative domains and their storage
  ansible.builtin.command:
    argv: [/usr/bin/virsh, -c, '{{ vms_libvirt_uri }}', undefine, --domain, '{{ item.item.name }}', --remove-all-storage]
  changed_when: true
  when: not (item.skipped | default(false))
  loop: '{{ __vms_delete_states.results }}'
  loop_control:
    label: '{{ item.item.name }}'

- name: Create missing administrative domains
  ansible.builtin.include_tasks: administrative_present.yml
  when:
    - item.state | default('') == 'present'
    - item.name not in __vms_on_node
  loop: '{{ vms }}'
  loop_control:
    label: '{{ item.name }}'
